<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:transparent;font-family:Arial,sans-serif;color:#173650}
.wrap{width:100%;max-width:100%;padding:5px 2px}canvas{display:block;max-width:100%;width:100%;height:210px;border:2px solid #7e9cb7;border-radius:12px;background:#fff;touch-action:none;cursor:crosshair}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;font-size:13px}
button{background:#edf4fc;color:#154b7b;border:1px solid #a9c5dd;border-radius:7px;padding:8px 16px;font-weight:700;cursor:pointer}
</style></head><body><div class="wrap"><canvas id="pad" aria-label="Recuadro para firmar"></canvas><div class="bar"><span>Firma aquí con el mouse o con el dedo.</span><button id="clear" type="button">Limpiar firma</button></div></div><script>
const canvas=document.getElementById('pad'),ctx=canvas.getContext('2d');let active=false,hasInk=false;
function send(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function resize(w,h){const saved=hasInk?canvas.toDataURL('image/png'):null;canvas.width=w||700;canvas.height=h||220;ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';if(saved){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=saved;}}
function xy(e){let r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);active=true;const p=xy(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.01,p.y+.01);ctx.stroke();hasInk=true;});
canvas.addEventListener('pointermove',e=>{if(!active)return;e.preventDefault();let p=xy(e);ctx.lineTo(p.x,p.y);ctx.stroke();});
function finish(e){if(!active)return;active=false;send('streamlit:setComponentValue',{value:canvas.toDataURL('image/png'),dataType:'json'});}
canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);
document.getElementById('clear').addEventListener('click',()=>{hasInk=false;resize(canvas.width,canvas.height);send('streamlit:setComponentValue',{value:null,dataType:'json'});});
window.addEventListener('message',e=>{if(e.data?.type==='streamlit:render'){let a=e.data.args||{};if(canvas.width!==a.width||canvas.height!==a.height)resize(a.width,a.height);send('streamlit:setFrameHeight',{height:270});}});
resize(700,220);send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:270});
</script></body></html>
